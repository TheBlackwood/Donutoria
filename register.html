<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donutoria | Register</title>

    <link rel="stylesheet" href="assets/css/style.css">

    <link rel="icon" type="image/png" href="assets/images/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<header class="navbar">

    <div class="logo">
        🍩 DONUTORIA
    </div>

    <div class="menu-toggle" id="menuToggle">
        ☰
    </div>

    <nav>

        <ul>

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="shop.html">Shop</a>
            </li>

            <li>
                <a href="rules.html">Rules</a>
            </li>

            <li>
                <a href="dashboard.html">Dashboard</a>
            </li>

            <li>
                <a href="login.html">Login</a>
            </li>

            <li>
                <button id="copyIP">
                    Copy IP
                </button>
            </li>

        </ul>

    </nav>

</header>


<div class="login-page">

    <div class="login-box">

        <h1>DONUTORIA</h1>

        <p>Create your account</p>

        <form id="registerForm">

            <input
                type="text"
                id="username"
                placeholder="Minecraft Username"
                required
            >

            <input
                type="tel"
                id="phone"
                placeholder="Phone Number"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

      <p id="registerMessage"></p>

    </div>

</div>


<footer class="footer">

    <div class="footer-content">

        <div class="footer-logo">

            <h2>🍩 DONUTORIA SMP</h2>

            <p>
                The next generation Minecraft Survival server.
            </p>

        </div>


        <div class="footer-links">

            <h3>Quick Links</h3>

            <a href="index.html">Home</a>

            <a href="shop.html">Shop</a>

            <a href="rules.html">Rules</a>

        </div>


        <div class="footer-server">

            <h3>Server</h3>

            <p>
                IP: play.donutoria.ir
            </p>

            <p>
                Version: 1.21.11
            </p>

        </div>

    </div>


    <hr>


    <p class="copyright">
        © 2026 Donutoria SMP. All Rights Reserved.
    </p>

</footer>


<script src="assets/js/app.js"></script>


<script>

const registerForm = document.getElementById("registerForm");

const registerMessage = document.getElementById("registerMessage");


registerForm.addEventListener("submit", async (event) => {

    event.preventDefault();


    const username =
        document.getElementById("username").value;

    const phone =
        document.getElementById("phone").value;


    try {

        const response = await fetch(
            "http://localhost:3000/api/register",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    username: username,
                    phone: phone
                })
            }
        );


        const data = await response.json();


        if (data.success) {

            registerMessage.textContent =
                "✅ ثبت نام با موفقیت انجام شد!";

            registerMessage.style.color = "#22c55e";

            registerForm.reset();

        } else {

            registerMessage.textContent =
                "❌ ثبت نام انجام نشد.";

            registerMessage.style.color = "#ef4444";

        }

    } catch (error) {

        console.error(error);

        registerMessage.textContent =
            "❌ اتصال به سرور برقرار نشد.";

        registerMessage.style.color = "#ef4444";

    }

});

</script>


</body>

</html>
